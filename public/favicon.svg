  <path d="M50 70V56" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <!-- Center Leaf -->
  <path d="M50 48C47 52 47 56 50 57C53 56 53 52 50 48Z" fill="#ffffff" />
